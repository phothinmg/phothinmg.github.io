<section id="achievements" class="section">
  <div class="container">
    <div class="section-title-container">
      <h2 class="section-title">Achievements</h2>
      <a href="/achievements" class="view-all" title="view-all-achievements"
        >View All</a
      >
    </div>
    <ol>
      {% for page in site.achievements %}
      <li>
        <a href="{{ page.url }}" style="font-size: 18px">{{ page.title }}</a>
      </li>
      {% endfor %}
    </ol>
  </div>
</section>
