<header class="header" role="banner">
  <nav role="navigation">
    <a href="{{'/'| relative_url}}" class="nav_logo">{{ site.title }}</a>
    <div class="nav_menu" id="nav-menu">
      <ul class="nav_list">
        {% if site.nav_links.size > 0 %}
          {% for item in site.nav_links %}
            <li class="nav_item">
              <a
                href="{{ item.link | relative_path }}"
                class="nav_link"
                id="{{ item.text | join: '-'|'link' }}">{{ item.text }}</a>
            </li>
          {% endfor %}
        {% endif %}
      </ul>
      <div class="nav_menu_tools">
        <button
          class="nav_theme nav_theme-mobile"
          data-theme-toggle
          type="button"
          aria-label="Switch to dark mode"
          title="Switch to dark mode">
          {% tabler ti-sun %}
          {% tabler ti-moon %}
          <span>Dark mode</span>
        </button>
      </div>
      <!-- Close button -->
      <button
        class="nav_close"
        id="nav-close"
        type="button"
        aria-label="Close menu">
        {% tabler ti-x %}
      </button>
    </div>
    <div class="nav_actions">
      <button
        class="nav_theme"
        data-theme-toggle
        type="button"
        aria-label="Switch to dark mode"
        title="Switch to dark mode">
        {% tabler ti-sun %}
        {% tabler ti-moon %}
      </button>

      <!-- Search button -->
      <button
        class="nav_search"
        id="search-btn"
        type="button"
        aria-label="Open search">
        {% tabler ti-search %}
      </button>

      <button
        class="nav_toggle"
        id="nav-toggle"
        type="button"
        aria-label="Open menu">
        {% tabler ti-menu-2 %}
      </button>
    </div>
  </nav>
</header>

<div
  class="search"
  id="search"
  role="search">
  <div
    id="pf-search"
    class="search_form"
    role="searchbox">
    <pagefind-searchbox></pagefind-searchbox>
  </div>
  <button
    class="search_close"
    id="search-close"
    type="button"
    aria-label="Close search">
    {% tabler ti-x %}
  </button>
</div>
