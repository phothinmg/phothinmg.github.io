---
layout: default
---

<section class="blog_body">
  <div class="container">
    <div class="blog_head">
      <h1>{{ page.title }}</h1>
      <p>{{ page.summary }}</p>
      <p>
        <time datetime="{{ page.publish_date | date_to_xmlschema }}">{{ page.publish_date | date: "%B %-d, %Y" }}</time>
      </p>
    </div>
    <article class="content_body">{{ content }}</article>
  </div>
</section>
