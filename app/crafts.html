---
layout: default
title: Crafts
---

<section class="section">
  <div class="container">
    <h2 class="section-title">Crafts</h2>
    <div class="project-container" id="crafts-view">
      {% for page in site.crafts %}
        <div class="craft-container">
          <a href="{{ page.url }}" class="craft-link">
            <span class="craft-meta">
              <span class="craft-meta-icon" aria-hidden="true"></span>
              <span>Interactive Craft</span>
            </span>
            <span class="craft-title">{{ page.title }}</span>
            <span class="craft-summary">{{ page.summary }}</span>
          </a>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
